plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custdb.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.custdb.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 纯系统 API 实现（WebView + SharedPreferences），无需任何第三方依赖
dependencies {
}
